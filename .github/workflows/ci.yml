name: tests
run-name: ${{ github.actor }} is running the tests
on: [push]
jobs: 
  lint-unit:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest  